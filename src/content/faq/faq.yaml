items:
  - question: Чи підійде курс, якщо я з нуля?
    answer: >-
      Так! Наші програми спеціально адаптовані для повних початківців. Ви
      почнете з азів — від алфавіту та базових фраз до простих діалогів.
      Навчання йде поступово, без складних термінів, а викладачі підтримують
      на кожному кроці, щоб ви відчували себе впевнено.
    openByDefault: true
  - question: Скільки часу потрібно приділяти навчанню?
    answer: >-
      Достатньо 20–40 хвилин на день. Ви самі обираєте темп навчання та
      можете проходити уроки тоді, коли вам зручно.
    openByDefault: false
  - question: Як визначити свій рівень іспанської?
    answer: >-
      Якщо ви вже вивчали мову, ви можете пройти короткий тест або
      звернутися до нас за консультацією. Ми допоможемо обрати відповідний
      курс.
    openByDefault: false
  - question: Чи є домашні завдання та практика?
    answer: >-
      Так. Кожен урок містить практичні вправи, інтерактивні завдання та
      можливість одразу закріпити новий матеріал.
    openByDefault: false
  - question: Чи видаєте ви сертифікат після завершення курсу?
    answer: >-
      Так, після успішного проходження курсу ви отримуєте сертифікат про
      його завершення.
    openByDefault: false
  - question: Чи можна навчатися з телефону?
    answer: >-
      Так. Усі матеріали доступні з комп'ютера, планшета та смартфона, тому
      ви можете навчатися будь-де.
    openByDefault: false
